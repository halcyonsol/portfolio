<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    >
    <meta name="theme-color" content="#000000">
    <meta
      name="description"
      content="TIMELINE. A speculative terminal where time is currency."
    >

    <title>TIMELINE — Time is currency</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>

  <body>
    <main class="terminal" aria-label="TIMELINE banking terminal">
      <!-- Persistent clock -->
      <header class="clock-header">
        <div
          id="countdown"
          class="nixie-clock"
          role="timer"
          aria-label="Remaining lifespan"
          aria-live="off"
        ></div>
      </header>

      <!-- Introduction and scrolling console output -->
      <div id="output-area" class="output-area">
        <p
          id="introduction"
          class="introduction"
          aria-label="Welcome to TIMELINE"
        >
          <span id="intro-text" aria-hidden="true"></span>
        </p>

        <div
          id="transcript"
          class="transcript"
          role="log"
          aria-label="Terminal output"
          aria-live="polite"
          aria-relevant="additions"
        ></div>
      </div>

      <!-- Command prompt fixed to the bottom of the terminal -->
      <form id="command-form" class="command-line" autocomplete="off">
        <label for="command-input" aria-label="Command">
          <span aria-hidden="true">&gt;</span>
          <span class="sr-only">Terminal command</span>
        </label>

        <input
          id="command-input"
          name="command"
          type="text"
          placeholder="type help"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          enterkeyhint="send"
          aria-label="Terminal command. Type help for all commands."
        >
      </form>

      <noscript>
        This terminal requires JavaScript to run its fictional clock and commands.
      </noscript>
    </main>
  </body>
</html>
